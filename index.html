<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Личный финансовый отчёт</title>
<style>
:root{
  --bg:#f5f6f8; --surface:#ffffff; --surface-2:#f0f2f5; --text:#15171c; --muted:#5b6270;
  --border:#e1e4ea; --accent:#2c56c9; --accent-ink:#ffffff; --accent-soft:#e8eefc;
  --pos:#14744a; --neg:#c22a2a; --neg-soft:#fdeeee; --warn-soft:#fff6df; --warn-border:#ecd08a;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.07);
  --radius:12px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0f1115; --surface:#171a21; --surface-2:#1f232c; --text:#e7e9ee; --muted:#9ba3b2;
    --border:#2a2f3a; --accent:#7f9dff; --accent-ink:#0d1020; --accent-soft:#1e2742;
    --pos:#4cc38a; --neg:#ff7070; --neg-soft:#3a1f23; --warn-soft:#2c2614; --warn-border:#6a5620;
    --shadow:none;
  }
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);
  font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1200px;margin:0 auto;padding:0 16px}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.neg{color:var(--neg)}
.pos{color:var(--pos)}
.muted{color:var(--muted)}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0}

/* Header */
header.top{background:var(--surface);border-bottom:1px solid var(--border)}
.top-inner{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding:14px 0}
.brand{font-size:18px;font-weight:650;margin:0;flex:1 1 auto;min-width:0}
.year-switch{display:flex;align-items:center;gap:4px}
.year-switch output{font-size:18px;font-weight:650;min-width:56px;text-align:center;font-variant-numeric:tabular-nums}
.actions{display:flex;flex-wrap:wrap;gap:8px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--border);
  background:var(--surface);border-radius:9px;padding:8px 12px;cursor:pointer;min-height:38px;line-height:1.2}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--neg)}
.btn:disabled{opacity:.4;cursor:default}
.icon-btn{border:0;background:transparent;border-radius:8px;width:36px;height:36px;display:inline-flex;
  align-items:center;justify-content:center;cursor:pointer;color:var(--muted)}
.icon-btn:hover{background:var(--surface-2);color:var(--text)}
.icon-btn:disabled{opacity:.3;cursor:default}
.icon-btn svg,.btn svg{width:18px;height:18px;flex:none}

/* Reminder */
.reminder{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:16px;padding:10px 14px;
  background:var(--warn-soft);border:1px solid var(--warn-border);border-radius:10px}
.reminder p{margin:0;flex:1 1 220px}

/* Month nav */
.months{display:flex;gap:6px;overflow-x:auto;padding:16px 0 4px;scrollbar-width:thin}
.tab{flex:none;border:1px solid var(--border);background:var(--surface);border-radius:999px;
  padding:6px 14px;cursor:pointer;position:relative;white-space:nowrap}
.tab:hover{background:var(--surface-2)}
.tab[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.tab.has::after{content:"";position:absolute;top:5px;right:6px;width:5px;height:5px;border-radius:50%;background:var(--accent)}
.tab.has[aria-pressed="true"]::after{background:var(--accent-ink)}

/* Layout */
.layout{display:grid;grid-template-columns:330px minmax(0,1fr);gap:20px;align-items:start;padding:12px 0 32px}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}
.panel h2{font-size:16px;margin:0 0 14px;font-weight:650}
.panel + .panel{margin-top:20px}
.period-title{font-size:22px;font-weight:700;margin:0 0 12px}

/* Cards */
.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:20px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 16px;min-width:0}
.card .label{font-size:13px;color:var(--muted)}
.card .value{font-size:21px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px;overflow-wrap:anywhere}
.card .sub{font-size:12px;color:var(--muted);margin-top:2px}
.card.is-neg{background:var(--neg-soft)}

/* Form */
.form-panel{position:sticky;top:16px}
.form-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.form-head h2{margin:0}
.sheet-close{display:none}
.field{margin-bottom:12px}
.field label,.field .lbl{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
.field input,.field select{width:100%;border:1px solid var(--border);background:var(--surface);border-radius:9px;padding:9px 11px;min-height:40px}
.field input[aria-invalid="true"],.field select[aria-invalid="true"]{border-color:var(--neg);box-shadow:0 0 0 1px var(--neg)}
.err{display:block;color:var(--neg);font-size:13px;margin-top:4px;min-height:0}
.err:empty{display:none}
.seg{position:relative;display:grid;grid-template-columns:1fr 1fr;background:var(--surface-2);border-radius:10px;padding:3px;gap:3px}
.seg input{position:absolute;left:0;top:0;width:1px;height:1px;margin:0;opacity:0;pointer-events:none}
.seg label{margin:0;text-align:center;padding:7px;border-radius:8px;cursor:pointer;color:var(--muted);font-size:14px}
.seg input:checked + label{background:var(--surface);color:var(--text);font-weight:600;box-shadow:var(--shadow)}
.seg input:focus-visible + label{outline:2px solid var(--accent);outline-offset:1px}
.form[data-type="income"] .only-expense,.form[data-type="expense"] .only-income{display:none}
.form-actions{display:flex;gap:8px;margin-top:4px}
.form-actions .btn{flex:1}
.hint{font-size:12px;color:var(--muted);margin:12px 0 0}

/* Tables */
.tbl-scroll{overflow-x:auto;margin:0 -18px;padding:0 18px}
table.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th,.tbl td{padding:9px 10px;border-bottom:1px solid var(--border);text-align:left;vertical-align:middle}
.tbl thead th{font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap}
.tbl tfoot th,.tbl tfoot td{font-weight:700;border-bottom:0}
.tbl tfoot tr.avg th,.tbl tfoot tr.avg td{font-weight:500;color:var(--muted)}
.tbl tr.empty td,.tbl tr.empty th{color:var(--muted)}
.tbl th:first-child,.tbl td:first-child{padding-left:0}
.tbl th:last-child,.tbl td:last-child{padding-right:0}
.tbl.year th:first-child{position:sticky;left:0;background:var(--surface);z-index:1}
.tbl.year tbody tr:hover th,.tbl.year tbody tr:hover td{background:var(--surface-2)}
.tbl.year tbody tr:hover th:first-child{background:var(--surface-2)}
.linkbtn{border:0;background:none;padding:0;color:var(--accent);cursor:pointer;font-weight:600;text-align:left}
.linkbtn:hover{text-decoration:underline}
.share{display:flex;align-items:center;justify-content:flex-end;gap:8px}
.bar{display:inline-block;width:70px;height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px}

/* List */
.list-head{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:10px}
.list-head h2{margin:0;flex:1 1 auto}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.filters select{border:1px solid var(--border);background:var(--surface);border-radius:9px;padding:6px 10px;min-height:36px;max-width:100%}
ul.ops{list-style:none;margin:0;padding:0}
.op{display:grid;grid-template-columns:52px minmax(0,1fr) auto auto;gap:4px 12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--border)}
.op:last-child{border-bottom:0}
.op-date{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.op-title{font-weight:600;overflow-wrap:anywhere}
.op-sub{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.op-amt{font-weight:650;font-variant-numeric:tabular-nums;white-space:nowrap}
.op-actions{display:flex}
.op.editing{background:var(--accent-soft);border-radius:8px}
.empty-state{color:var(--muted);text-align:center;padding:24px 8px;margin:0}

footer.foot{border-top:1px solid var(--border);padding:16px 0 90px;color:var(--muted);font-size:13px}
.foot-inner{display:flex;flex-wrap:wrap;gap:6px 20px;justify-content:space-between}

/* Toast */
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--text);color:var(--bg);
  padding:10px 16px;border-radius:10px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:100;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* Dialog */
dialog{border:1px solid var(--border);border-radius:14px;background:var(--surface);color:var(--text);padding:20px;max-width:420px;width:calc(100% - 32px)}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog h2{margin:0 0 8px;font-size:18px}
dialog p{margin:0 0 16px;color:var(--muted)}
.dlg-actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}

.fab,.backdrop{display:none}

@media (max-width: 960px){
  .cards{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width: 760px){
  .layout{grid-template-columns:minmax(0,1fr)}
  .brand{flex-basis:100%}
  .top-inner{padding:12px 0}
  .actions .btn span.long{display:none}
  .form-panel{position:fixed;left:0;right:0;bottom:0;top:auto;z-index:60;border-radius:16px 16px 0 0;
    max-height:92vh;overflow:auto;transform:translateY(100%);visibility:hidden;
    transition:transform .25s ease,visibility .25s;margin:0;border-bottom:0}
  .form-panel.open{transform:none;visibility:visible}
  .sheet-close{display:inline-flex}
  .backdrop{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:55}
  .backdrop.show{display:block}
  .fab{display:flex;position:fixed;right:16px;bottom:20px;z-index:50;width:56px;height:56px;border-radius:50%;
    border:0;background:var(--accent);color:var(--accent-ink);align-items:center;justify-content:center;cursor:pointer;
    box-shadow:0 4px 14px rgba(0,0,0,.25)}
  .fab svg{width:26px;height:26px}
  .card .value{font-size:18px}
  .period-title{font-size:19px}
  .op{grid-template-columns:44px minmax(0,1fr) auto;}
  .op-actions{grid-column:2 / 4;justify-content:flex-end;margin-top:-6px}
  .bar{width:44px}
}
@media (prefers-reduced-motion: reduce){ *{transition:none!important} }
</style>
</head>
<body>
<noscript><p style="padding:16px">Для работы сайта включите JavaScript.</p></noscript>

<header class="top">
  <div class="wrap top-inner">
    <h1 class="brand">Личный финансовый отчёт</h1>
    <div class="year-switch" role="group" aria-label="Выбор года">
      <button class="icon-btn" id="yearPrev" aria-label="Предыдущий год"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
      <output id="yearLabel" aria-live="polite"></output>
      <button class="icon-btn" id="yearNext" aria-label="Следующий год"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></button>
    </div>
    <div class="actions">
      <button class="btn" id="exportJson" title="Скачать резервную копию всех данных (JSON)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg>Экспорт</button>
      <button class="btn" id="exportCsv" title="Скачать операции выбранного года в CSV">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M8 13h8M8 17h8"/></svg>CSV<span class="long">&nbsp;за год</span></button>
      <button class="btn" id="importBtn" title="Загрузить данные из JSON">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21V9M7 14l5-5 5 5M5 3h14"/></svg>Импорт</button>
      <input type="file" id="importFile" accept=".json,application/json" hidden>
    </div>
  </div>
</header>

<main class="wrap">
  <div id="reminder"></div>
  <nav class="months" id="months" aria-label="Выбор периода"></nav>

  <div class="layout">
    <aside class="panel form-panel" id="formPanel" aria-labelledby="formTitle">
      <div class="form-head">
        <h2 id="formTitle">Новая операция</h2>
        <button class="icon-btn sheet-close" id="sheetClose" aria-label="Закрыть форму"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </div>
      <form class="form" id="txForm" data-type="expense" novalidate>
        <div class="field">
          <span class="lbl" id="typeLbl">Тип</span>
          <div class="seg" role="radiogroup" aria-labelledby="typeLbl">
            <input type="radio" name="type" id="tExpense" value="expense" checked><label for="tExpense">Расход</label>
            <input type="radio" name="type" id="tIncome" value="income"><label for="tIncome">Доход</label>
          </div>
        </div>
        <div class="field">
          <label for="fDate">Дата</label>
          <input type="date" id="fDate" name="date" required aria-describedby="err-date">
          <span class="err" id="err-date"></span>
        </div>
        <div class="field">
          <label for="fAmount">Сумма, ₸</label>
          <input type="text" id="fAmount" name="amount" inputmode="decimal" autocomplete="off" placeholder="0,00" required aria-describedby="err-amount">
          <span class="err" id="err-amount"></span>
        </div>
        <div class="field only-expense">
          <label for="fCategory">Категория</label>
          <select id="fCategory" name="category" aria-describedby="err-category"></select>
          <span class="err" id="err-category"></span>
        </div>
        <div class="field only-income">
          <label for="fSource">Источник <span class="muted">(необязательно)</span></label>
          <input type="text" id="fSource" name="source" maxlength="100" list="sourceList" placeholder="Зарплата, подработка…" aria-describedby="err-source">
          <datalist id="sourceList"></datalist>
          <span class="err" id="err-source"></span>
        </div>
        <div class="field">
          <label for="fComment">Комментарий <span class="muted">(необязательно)</span></label>
          <input type="text" id="fComment" name="comment" maxlength="200" aria-describedby="err-comment">
          <span class="err" id="err-comment"></span>
        </div>
        <div class="form-actions">
          <button type="button" class="btn" id="cancelEdit" hidden>Отмена</button>
          <button type="submit" class="btn primary" id="submitBtn">Добавить</button>
        </div>
        <p class="hint">Данные сохраняются автоматически в этом браузере. Делайте резервную копию кнопкой «Экспорт».</p>
      </form>
    </aside>

    <section aria-labelledby="periodTitle">
      <h2 class="period-title" id="periodTitle"></h2>
      <div class="cards" id="cards"></div>
      <div class="panel" id="report"></div>
      <div class="panel">
        <div class="list-head">
          <h2 id="listTitle">Операции</h2>
          <div class="filters">
            <label class="sr-only" for="filterType">Фильтр по типу</label>
            <select id="filterType">
              <option value="all">Все типы</option>
              <option value="expense">Расходы</option>
              <option value="income">Доходы</option>
            </select>
            <label class="sr-only" for="filterCat">Фильтр по категории</label>
            <select id="filterCat"></select>
          </div>
        </div>
        <div id="opsList"></div>
      </div>
    </section>
  </div>
</main>

<footer class="foot">
  <div class="wrap foot-inner">
    <span id="lastExport"></span>
    <span id="appVersion"></span>
  </div>
</footer>

<button class="fab" id="fab" aria-label="Добавить операцию"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
<div class="backdrop" id="backdrop"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<dialog id="importDlg" aria-labelledby="importTitle">
  <form method="dialog">
    <h2 id="importTitle">Импорт данных</h2>
    <p id="importText"></p>
    <div class="dlg-actions">
      <button class="btn" value="cancel">Отмена</button>
      <button class="btn danger" value="replace">Заменить всё</button>
      <button class="btn primary" value="merge">Объединить</button>
    </div>
  </form>
</dialog>

<script>
(function () {
'use strict';

const APP_VERSION = '1.0.0';
const DAY = 86400000;
const CATS = [
  { id: 'utilities',     name: 'Коммунальные услуги',          short: 'Коммуналка' },
  { id: 'food',          name: 'Питание',                      short: 'Питание' },
  { id: 'transport',     name: 'Проезд',                       short: 'Проезд' },
  { id: 'sport',         name: 'Спорт',                        short: 'Спорт' },
  { id: 'entertainment', name: 'Развлекательные мероприятия',  short: 'Развлечения' },
  { id: 'other',         name: 'Прочие',                       short: 'Прочие' }
];
const CAT_IDS = new Set(CATS.map(c => c.id));
const catName = id => (CATS.find(c => c.id === id) || { name: 'Прочие' }).name;
const MONTHS = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const MONTHS_GEN = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const MONTHS_SHORT = ['Янв','Фев','Мар','Апр','Май','Июн','Июл','Авг','Сен','Окт','Ноя','Дек'];

const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2, '0');
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const todayISO = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
const fmtDate = iso => { const [y, m, d] = iso.split('-'); return `${d}.${m}.${y}`; };
const nf2 = new Intl.NumberFormat('ru-RU', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const nf0 = new Intl.NumberFormat('ru-RU', { maximumFractionDigits: 2 });
const nfPct = new Intl.NumberFormat('ru-RU', { maximumFractionDigits: 1 });

// Суммы внутри приложения — в тиынах (1/100 тенге, целые числа) (целые числа)
function money(k, opts) {
  opts = opts || {};
  const abs = Math.abs(k);
  const s = (opts.short && abs % 100 === 0 ? nf0 : nf2).format(abs / 100);
  const pre = k < 0 ? '−' : (opts.sign && k > 0 ? '+' : '');
  return pre + s + ' ₸';
}

function uuid() {
  try { if (window.crypto && crypto.randomUUID) return crypto.randomUUID(); } catch (e) {}
  const b = new Uint8Array(16);
  if (window.crypto && crypto.getRandomValues) crypto.getRandomValues(b);
  else for (let i = 0; i < 16; i++) b[i] = Math.floor(Math.random() * 256);
  b[6] = (b[6] & 15) | 64; b[8] = (b[8] & 63) | 128;
  const h = Array.from(b, x => x.toString(16).padStart(2, '0')).join('');
  return `${h.slice(0, 8)}-${h.slice(8, 12)}-${h.slice(12, 16)}-${h.slice(16, 20)}-${h.slice(20)}`;
}

/* ---------- Состояние ---------- */
const now = new Date();
const state = {
  txs: [],
  year: now.getFullYear(),
  month: now.getMonth(),     // null = «Весь год»
  fType: 'all',
  fCat: 'all',
  editingId: null,
  lastExport: null
};

/* ---------- Хранилище: IndexedDB, запасной вариант — localStorage ---------- */
const LS_KEY = 'finance-report-v1';
const reqP = r => new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
const doneP = t => new Promise((res, rej) => { t.oncomplete = () => res(); t.onerror = t.onabort = () => rej(t.error); });

const Store = {
  mode: 'idb',
  db: null,
  async init() {
    try {
      if (!window.indexedDB) throw new Error('no idb');
      this.db = await new Promise((res, rej) => {
        const r = indexedDB.open('finance-report', 1);
        r.onupgradeneeded = () => {
          const db = r.result;
          if (!db.objectStoreNames.contains('transactions')) db.createObjectStore('transactions', { keyPath: 'id' });
          if (!db.objectStoreNames.contains('meta')) db.createObjectStore('meta', { keyPath: 'key' });
        };
        r.onsuccess = () => res(r.result);
        r.onerror = () => rej(r.error);
        r.onblocked = () => rej(new Error('blocked'));
      });
    } catch (e) {
      this.mode = 'ls';
    }
  },
  async load() {
    if (this.mode === 'idb') {
      const t = this.db.transaction(['transactions', 'meta'], 'readonly');
      const [list, meta] = await Promise.all([
        reqP(t.objectStore('transactions').getAll()),
        reqP(t.objectStore('meta').get('lastExport'))
      ]);
      return { list: list || [], lastExport: meta ? meta.value : null };
    }
    try {
      const d = JSON.parse(localStorage.getItem(LS_KEY) || '{}');
      return { list: d.transactions || [], lastExport: d.lastExport || null };
    } catch (e) { return { list: [], lastExport: null }; }
  },
  saveLS() { localStorage.setItem(LS_KEY, JSON.stringify({ transactions: state.txs, lastExport: state.lastExport })); },
  async put(tx) {
    if (this.mode !== 'idb') return this.saveLS();
    const t = this.db.transaction('transactions', 'readwrite');
    t.objectStore('transactions').put(tx);
    return doneP(t);
  },
  async remove(id) {
    if (this.mode !== 'idb') return this.saveLS();
    const t = this.db.transaction('transactions', 'readwrite');
    t.objectStore('transactions').delete(id);
    return doneP(t);
  },
  async putMany(list, clearFirst) {
    if (this.mode !== 'idb') return this.saveLS();
    const t = this.db.transaction('transactions', 'readwrite');
    const s = t.objectStore('transactions');
    if (clearFirst) s.clear();
    list.forEach(x => s.put(x));
    return doneP(t);
  },
  async setMeta(key, value) {
    if (this.mode !== 'idb') return this.saveLS();
    const t = this.db.transaction('meta', 'readwrite');
    t.objectStore('meta').put({ key, value });
    return doneP(t);
  }
};

/* ---------- Расчёты ---------- */
function periodPrefix(y, m) { return m == null ? `${y}-` : `${y}-${pad(m + 1)}`; }
function periodTxs(y, m) { const p = periodPrefix(y, m); return state.txs.filter(t => t.date.startsWith(p)); }
function aggregate(list) {
  const cats = {}; CATS.forEach(c => { cats[c.id] = 0; });
  let inc = 0, exp = 0;
  for (const t of list) {
    if (t.type === 'income') inc += t.amount;
    else { exp += t.amount; cats[CAT_IDS.has(t.category) ? t.category : 'other'] += t.amount; }
  }
  return { inc, exp, bal: inc - exp, cats, count: list.length };
}
function cumulative(endDate) {
  let s = 0;
  for (const t of state.txs) if (t.date <= endDate) s += t.type === 'income' ? t.amount : -t.amount;
  return s;
}
function years() {
  const s = new Set(state.txs.map(t => +t.date.slice(0, 4)));
  s.add(new Date().getFullYear()); s.add(state.year);
  return Array.from(s).sort((a, b) => a - b);
}
const sortDesc = (a, b) => b.date.localeCompare(a.date) || String(b.createdAt || '').localeCompare(String(a.createdAt || ''));

/* ---------- Отрисовка ---------- */
function render() {
  renderYear();
  renderMonths();
  renderSummary();
  renderReport();
  renderList();
  renderFooter();
  renderReminder();
}

function renderYear() {
  const ys = years();
  $('#yearLabel').textContent = state.year;
  const i = ys.indexOf(state.year);
  $('#yearPrev').disabled = i <= 0;
  $('#yearNext').disabled = i >= ys.length - 1;
}

function renderMonths() {
  const withData = new Set(periodTxs(state.year, null).map(t => +t.date.slice(5, 7) - 1));
  const nav = $('#months');
  nav.innerHTML =
    `<button class="tab" data-month="all" aria-pressed="${state.month == null}">Весь год</button>` +
    MONTHS_SHORT.map((n, i) =>
      `<button class="tab${withData.has(i) ? ' has' : ''}" data-month="${i}" aria-pressed="${state.month === i}" aria-label="${MONTHS[i]}${withData.has(i) ? ', есть операции' : ''}">${n}</button>`
    ).join('');
  const active = nav.querySelector('[aria-pressed="true"]');
  if (active && nav.scrollWidth > nav.clientWidth) nav.scrollLeft = active.offsetLeft - nav.clientWidth / 2 + active.offsetWidth / 2;
}

function renderSummary() {
  const m = state.month, y = state.year;
  const a = aggregate(periodTxs(y, m));
  const periodLbl = m == null ? `за ${y} год` : `за ${MONTHS[m].toLowerCase()} ${y}`;
  const endDate = m == null ? `${y}-12-31` : `${y}-${pad(m + 1)}-31`;
  const cum = cumulative(endDate);
  const endLbl = m == null ? `на конец ${y} года` : `на конец ${MONTHS_GEN[m]} ${y}`;
  $('#periodTitle').textContent = m == null ? `${y} год` : `${MONTHS[m]} ${y}`;
  const card = (label, value, sub, cls) =>
    `<div class="card${cls === 'neg' ? ' is-neg' : ''}"><div class="label">${label}</div><div class="value ${cls || ''}">${value}</div><div class="sub">${sub}</div></div>`;
  $('#cards').innerHTML =
    card('Доходы', money(a.inc), periodLbl, a.inc ? 'pos' : '') +
    card('Расходы', money(a.exp), periodLbl) +
    card('Остаток', money(a.bal), 'доходы − расходы', a.bal < 0 ? 'neg' : '') +
    card('Накопленный остаток', money(cum), endLbl, cum < 0 ? 'neg' : '');
}

function renderReport() {
  const box = $('#report');
  if (state.month != null) {
    const a = aggregate(periodTxs(state.year, state.month));
    const rows = CATS.map(c => {
      const v = a.cats[c.id];
      const pct = a.exp ? v / a.exp * 100 : 0;
      return `<tr class="${v ? '' : 'empty'}"><td>${c.name}</td><td class="num">${v ? money(v) : '—'}</td>
        <td class="num"><span class="share"><span class="bar" aria-hidden="true"><i style="width:${pct.toFixed(1)}%"></i></span>${v ? nfPct.format(pct) + ' %' : '—'}</span></td></tr>`;
    }).join('');
    box.innerHTML = `<h2>Расходы по категориям</h2>
      <div class="tbl-scroll"><table class="tbl">
        <thead><tr><th scope="col">Категория</th><th scope="col" class="num">Сумма</th><th scope="col" class="num">Доля</th></tr></thead>
        <tbody>${rows}</tbody>
        <tfoot><tr><th scope="row">Итого</th><td class="num">${money(a.exp)}</td><td class="num">${a.exp ? '100 %' : '—'}</td></tr></tfoot>
      </table></div>`;
    return;
  }
  // Годовая сводная таблица
  const per = MONTHS.map((_, i) => aggregate(periodTxs(state.year, i)));
  const total = aggregate(periodTxs(state.year, null));
  const active = per.filter(p => p.count > 0).length;
  const cell = (v, cls) => `<td class="num ${cls || ''}">${v ? money(v) : '—'}</td>`;
  const balCell = v => `<td class="num ${v < 0 ? 'neg' : ''}">${v ? money(v) : '—'}</td>`;
  const rowFor = (p, i) => `<tr class="${p.count ? '' : 'empty'}">
      <th scope="row"><button class="linkbtn" data-open-month="${i}" aria-label="Открыть отчёт за ${MONTHS[i].toLowerCase()}">${MONTHS[i]}</button></th>
      ${cell(p.inc, p.inc ? 'pos' : '')}${CATS.map(c => cell(p.cats[c.id])).join('')}${cell(p.exp)}${balCell(p.bal)}</tr>`;
  const avg = v => active ? Math.round(v / active) : 0;
  box.innerHTML = `<h2>Сводка за ${state.year} год по месяцам</h2>
    <div class="tbl-scroll"><table class="tbl year">
      <thead><tr><th scope="col">Месяц</th><th scope="col" class="num">Доходы</th>
        ${CATS.map(c => `<th scope="col" class="num" title="${c.name}">${c.short}</th>`).join('')}
        <th scope="col" class="num">Итого расходы</th><th scope="col" class="num">Остаток</th></tr></thead>
      <tbody>${per.map(rowFor).join('')}</tbody>
      <tfoot>
        <tr><th scope="row">Итого за год</th>${cell(total.inc, total.inc ? 'pos' : '')}${CATS.map(c => cell(total.cats[c.id])).join('')}${cell(total.exp)}${balCell(total.bal)}</tr>
        <tr class="avg"><th scope="row">Среднее в месяц</th>${cell(avg(total.inc))}${CATS.map(c => cell(avg(total.cats[c.id]))).join('')}${cell(avg(total.exp))}${balCell(avg(total.bal))}</tr>
      </tfoot>
    </table></div>
    <p class="hint">Нажмите на месяц, чтобы открыть подробный отчёт. Среднее считается по месяцам, в которых есть операции${active ? ` (${active})` : ''}.</p>`;
}

const ICON_EDIT = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>';
const ICON_DEL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg>';

function renderList() {
  const fc = $('#filterCat');
  fc.disabled = state.fType === 'income';
  let list = periodTxs(state.year, state.month);
  if (state.fType !== 'all') list = list.filter(t => t.type === state.fType);
  if (state.fCat !== 'all' && state.fType !== 'income') list = list.filter(t => t.type === 'expense' && t.category === state.fCat);
  list.sort(sortDesc);
  $('#listTitle').textContent = `Операции${list.length ? ` (${list.length})` : ''}`;
  if (!list.length) {
    const any = periodTxs(state.year, state.month).length;
    $('#opsList').innerHTML = `<p class="empty-state">${any ? 'Нет операций, подходящих под фильтр.' : 'Операций за этот период пока нет. Добавьте первую через форму.'}</p>`;
    return;
  }
  $('#opsList').innerHTML = '<ul class="ops">' + list.map(t => {
    const inc = t.type === 'income';
    const title = inc ? (t.source ? `Доход · ${esc(t.source)}` : 'Доход') : esc(catName(t.category));
    const d = state.month == null ? fmtDate(t.date).slice(0, 5) : t.date.slice(8, 10) + '.' + t.date.slice(5, 7);
    return `<li class="op${state.editingId === t.id ? ' editing' : ''}">
      <div class="op-date">${d}</div>
      <div><div class="op-title">${title}</div>${t.comment ? `<div class="op-sub">${esc(t.comment)}</div>` : ''}</div>
      <div class="op-amt num ${inc ? 'pos' : ''}">${inc ? '+' : '−'}${money(t.amount)}</div>
      <div class="op-actions">
        <button class="icon-btn" data-edit="${esc(t.id)}" aria-label="Изменить операцию от ${fmtDate(t.date)} на ${money(t.amount)}">${ICON_EDIT}</button>
        <button class="icon-btn" data-del="${esc(t.id)}" aria-label="Удалить операцию от ${fmtDate(t.date)} на ${money(t.amount)}">${ICON_DEL}</button>
      </div></li>`;
  }).join('') + '</ul>';
}

function renderFooter() {
  $('#lastExport').textContent = state.lastExport
    ? `Последний экспорт: ${fmtDate(state.lastExport.slice(0, 10))}`
    : 'Резервная копия ещё не создавалась';
  $('#appVersion').textContent = `Версия ${APP_VERSION}${Store.mode === 'ls' ? ' · хранение: localStorage' : ''}`;
  const sources = Array.from(new Set(state.txs.filter(t => t.type === 'income' && t.source).map(t => t.source))).slice(0, 30);
  $('#sourceList').innerHTML = sources.map(s => `<option value="${esc(s)}">`).join('');
}

let reminderDismissed = false;
function renderReminder() {
  const box = $('#reminder');
  if (reminderDismissed || !state.txs.length) { box.innerHTML = ''; return; }
  let ref = state.lastExport;
  if (!ref) ref = state.txs.reduce((m, t) => (t.createdAt && (!m || t.createdAt < m) ? t.createdAt : m), null);
  const days = ref ? Math.floor((Date.now() - Date.parse(ref)) / DAY) : 0;
  if (days <= 30) { box.innerHTML = ''; return; }
  box.innerHTML = `<div class="reminder" role="status">
    <p>${state.lastExport ? `Последняя резервная копия была ${days} дн. назад.` : 'Резервная копия ещё не создавалась.'} Рекомендуем сохранить данные в файл.</p>
    <button class="btn primary" data-act="export">Сделать копию</button>
    <button class="icon-btn" data-act="dismiss" aria-label="Скрыть напоминание"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>`;
}

/* ---------- Уведомления ---------- */
let toastTimer;
function toast(msg) {
  const el = $('#toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2600);
}

/* ---------- Форма ---------- */
const form = $('#txForm');
const F = { date: $('#fDate'), amount: $('#fAmount'), category: $('#fCategory'), source: $('#fSource'), comment: $('#fComment') };

function fillCategoryOptions() {
  F.category.innerHTML = '<option value="">— выберите —</option>' + CATS.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
  $('#filterCat').innerHTML = '<option value="all">Все категории</option>' + CATS.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
}
const getType = () => form.elements.type.value;
function setType(t) { form.elements.type.value = t; form.dataset.type = t; }

function setErr(name, msg) {
  $('#err-' + name).textContent = msg;
  F[name].setAttribute('aria-invalid', 'true');
}
function clearErrors() {
  Object.keys(F).forEach(k => { $('#err-' + k).textContent = ''; F[k].removeAttribute('aria-invalid'); });
}

function readForm() {
  clearErrors();
  const type = getType();
  const date = F.date.value;
  const raw = F.amount.value.replace(/[\s  ]/g, '').replace(',', '.');
  const category = F.category.value;
  const source = F.source.value.trim();
  const comment = F.comment.value.trim();
  let amount = 0, firstBad = null;
  const bad = (n, m) => { setErr(n, m); if (!firstBad) firstBad = F[n]; };

  if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) bad('date', 'Укажите дату операции.');
  if (!raw) bad('amount', 'Введите сумму.');
  else if (!/^\d+([.]\d{1,2})?$/.test(raw)) bad('amount', 'Сумма — число, не более 2 знаков после запятой (например, 1500,50).');
  else {
    amount = Math.round(parseFloat(raw) * 100);
    if (amount <= 0) bad('amount', 'Сумма должна быть больше нуля.');
    else if (amount > 1e13) bad('amount', 'Слишком большая сумма.');
  }
  if (type === 'expense' && !CAT_IDS.has(category)) bad('category', 'Выберите категорию расхода.');
  if (type === 'income' && source.length > 100) bad('source', 'Не более 100 символов.');
  if (comment.length > 200) bad('comment', 'Не более 200 символов.');

  if (firstBad) { firstBad.focus(); return null; }
  return {
    type, date, amount,
    category: type === 'expense' ? category : null,
    source: type === 'income' ? (source || null) : null,
    comment: comment || null
  };
}

function resetForm(keepDateType) {
  const date = F.date.value, type = getType();
  form.reset();
  clearErrors();
  F.date.value = keepDateType && date ? date : todayISO();
  setType(keepDateType ? type : 'expense');
  state.editingId = null;
  $('#formTitle').textContent = 'Новая операция';
  $('#submitBtn').textContent = 'Добавить';
  $('#cancelEdit').hidden = true;
}

function startEdit(id) {
  const t = state.txs.find(x => x.id === id);
  if (!t) return;
  clearErrors();
  state.editingId = id;
  setType(t.type);
  F.date.value = t.date;
  F.amount.value = nf2.format(t.amount / 100).replace(/[\s  ]/g, '');
  F.category.value = t.category || '';
  F.source.value = t.source || '';
  F.comment.value = t.comment || '';
  $('#formTitle').textContent = 'Редактирование';
  $('#submitBtn').textContent = 'Сохранить';
  $('#cancelEdit').hidden = false;
  renderList();
  if (isMobile()) openSheet(); else $('#formPanel').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  F.amount.focus();
}

function goToDate(iso) {
  const y = +iso.slice(0, 4), m = +iso.slice(5, 7) - 1;
  if (y !== state.year) { state.year = y; if (state.month != null) state.month = m; }
  else if (state.month != null && state.month !== m) state.month = m;
}

form.addEventListener('change', e => { if (e.target.name === 'type') { form.dataset.type = getType(); clearErrors(); } });
form.addEventListener('submit', async e => {
  e.preventDefault();
  const data = readForm();
  if (!data) return;
  const stamp = new Date().toISOString();
  const editing = state.editingId;
  let tx;
  if (editing) {
    const old = state.txs.find(x => x.id === editing);
    tx = Object.assign({}, old, data, { updatedAt: stamp });
    state.txs = state.txs.map(x => (x.id === editing ? tx : x));
  } else {
    tx = Object.assign({ id: uuid() }, data, { createdAt: stamp, updatedAt: stamp });
    state.txs.push(tx);
  }
  try { await Store.put(tx); } catch (err) { toast('Ошибка сохранения: ' + (err && err.message || err)); return; }
  goToDate(tx.date);
  resetForm(true);
  render();
  toast(editing ? 'Изменения сохранены' : `Добавлено: ${tx.type === 'income' ? '+' : '−'}${money(tx.amount)}`);
  if (editing && isMobile()) closeSheet(); else F.amount.focus();
});
$('#cancelEdit').addEventListener('click', () => { resetForm(true); renderList(); if (isMobile()) closeSheet(); });

async function removeTx(id) {
  const t = state.txs.find(x => x.id === id);
  if (!t) return;
  if (!confirm(`Удалить операцию на ${money(t.amount, { short: true })} от ${fmtDate(t.date)}?`)) return;
  state.txs = state.txs.filter(x => x.id !== id);
  try { await Store.remove(id); } catch (err) { toast('Ошибка удаления'); }
  if (state.editingId === id) resetForm(true);
  render();
  toast('Операция удалена');
}

/* ---------- Мобильная форма (bottom sheet) ---------- */
const mq = window.matchMedia('(max-width: 760px)');
const isMobile = () => mq.matches;
function openSheet() { $('#formPanel').classList.add('open'); $('#backdrop').classList.add('show'); setTimeout(() => F.amount.focus(), 50); }
function closeSheet() { $('#formPanel').classList.remove('open'); $('#backdrop').classList.remove('show'); $('#fab').focus(); }
$('#fab').addEventListener('click', openSheet);
$('#sheetClose').addEventListener('click', () => { if (state.editingId) { resetForm(true); renderList(); } closeSheet(); });
$('#backdrop').addEventListener('click', closeSheet);
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#formPanel').classList.contains('open')) closeSheet(); });
mq.addEventListener && mq.addEventListener('change', () => { $('#formPanel').classList.remove('open'); $('#backdrop').classList.remove('show'); });

/* ---------- Навигация ---------- */
$('#yearPrev').addEventListener('click', () => { const ys = years(); const i = ys.indexOf(state.year); if (i > 0) { state.year = ys[i - 1]; render(); } });
$('#yearNext').addEventListener('click', () => { const ys = years(); const i = ys.indexOf(state.year); if (i < ys.length - 1) { state.year = ys[i + 1]; render(); } });
$('#months').addEventListener('click', e => {
  const b = e.target.closest('[data-month]'); if (!b) return;
  state.month = b.dataset.month === 'all' ? null : +b.dataset.month;
  render();
});
$('#report').addEventListener('click', e => {
  const b = e.target.closest('[data-open-month]'); if (!b) return;
  state.month = +b.dataset.openMonth;
  render();
  $('#periodTitle').scrollIntoView({ behavior: 'smooth', block: 'start' });
});
$('#opsList').addEventListener('click', e => {
  const ed = e.target.closest('[data-edit]'); if (ed) return startEdit(ed.dataset.edit);
  const dl = e.target.closest('[data-del]'); if (dl) return removeTx(dl.dataset.del);
});
$('#filterType').addEventListener('change', e => { state.fType = e.target.value; renderList(); });
$('#filterCat').addEventListener('change', e => { state.fCat = e.target.value; renderList(); });
$('#reminder').addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  if (b.dataset.act === 'export') exportJson();
  else { reminderDismissed = true; renderReminder(); }
});

/* ---------- Экспорт / импорт ---------- */
function download(name, content, type) {
  const blob = new Blob([content], { type });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

async function exportJson() {
  const stamp = new Date().toISOString();
  const data = {
    version: 1,
    exportedAt: stamp,
    transactions: state.txs.slice().sort((a, b) => a.date.localeCompare(b.date)).map(t => Object.assign({}, t, { amount: t.amount / 100 }))
  };
  download(`finance-backup-${todayISO()}.json`, JSON.stringify(data, null, 2), 'application/json');
  state.lastExport = stamp;
  try { await Store.setMeta('lastExport', stamp); } catch (e) {}
  reminderDismissed = false;
  renderFooter(); renderReminder();
  toast(`Резервная копия сохранена (${state.txs.length} опер.)`);
}

function exportCsv() {
  const list = periodTxs(state.year, null).sort((a, b) => a.date.localeCompare(b.date));
  if (!list.length) { toast(`За ${state.year} год нет операций`); return; }
  const cell = v => { const s = v == null ? '' : String(v); return /[;"\r\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
  const rows = [['Дата', 'Тип', 'Категория', 'Источник', 'Сумма', 'Комментарий']].concat(list.map(t => [
    fmtDate(t.date), t.type === 'income' ? 'Доход' : 'Расход', t.type === 'expense' ? catName(t.category) : '',
    t.source || '', (t.amount / 100).toFixed(2).replace('.', ','), t.comment || ''
  ]));
  download(`finance-${state.year}.csv`, '﻿' + rows.map(r => r.map(cell).join(';')).join('\r\n'), 'text/csv;charset=utf-8');
  toast(`CSV за ${state.year} год сохранён`);
}

function normalizeTx(raw) {
  if (!raw || typeof raw !== 'object') return null;
  if (raw.type !== 'income' && raw.type !== 'expense') return null;
  if (typeof raw.date !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(raw.date)) return null;
  const amt = Number(typeof raw.amount === 'string' ? raw.amount.replace(',', '.') : raw.amount);
  if (!isFinite(amt) || amt <= 0) return null;
  const str = (v, n) => (typeof v === 'string' && v.trim() ? v.trim().slice(0, n) : null);
  const stamp = new Date().toISOString();
  return {
    id: typeof raw.id === 'string' && raw.id ? raw.id : uuid(),
    type: raw.type,
    date: raw.date,
    amount: Math.round(amt * 100),
    category: raw.type === 'expense' ? (CAT_IDS.has(raw.category) ? raw.category : 'other') : null,
    source: raw.type === 'income' ? str(raw.source, 100) : null,
    comment: str(raw.comment, 200),
    createdAt: typeof raw.createdAt === 'string' ? raw.createdAt : stamp,
    updatedAt: typeof raw.updatedAt === 'string' ? raw.updatedAt : stamp
  };
}

let pendingImport = null;
$('#importBtn').addEventListener('click', () => $('#importFile').click());
$('#importFile').addEventListener('change', async e => {
  const file = e.target.files[0];
  e.target.value = '';
  if (!file) return;
  let parsed;
  try { parsed = JSON.parse(await file.text()); } catch (err) { toast('Не удалось прочитать файл: это не JSON'); return; }
  const rawList = Array.isArray(parsed) ? parsed : (parsed && Array.isArray(parsed.transactions) ? parsed.transactions : null);
  if (!rawList) { toast('В файле нет списка операций'); return; }
  const seen = new Set(), list = [];
  let skipped = 0;
  for (const r of rawList) {
    const t = normalizeTx(r);
    if (!t || seen.has(t.id)) { skipped++; continue; }
    seen.add(t.id); list.push(t);
  }
  if (!list.length) { toast('В файле нет корректных операций'); return; }
  pendingImport = list;
  $('#importText').textContent =
    `В файле «${file.name}» ${list.length} опер.${skipped ? ` (пропущено некорректных: ${skipped})` : ''}. ` +
    `Сейчас сохранено ${state.txs.length} опер. «Заменить всё» удалит текущие данные и загрузит данные из файла. ` +
    `«Объединить» добавит только новые операции (совпадения по id пропускаются).`;
  $('#importDlg').showModal();
});
$('#importDlg').addEventListener('close', async () => {
  const action = $('#importDlg').returnValue;
  const list = pendingImport; pendingImport = null;
  if (!list || (action !== 'replace' && action !== 'merge')) return;
  try {
    if (action === 'replace') {
      state.txs = list;
      await Store.putMany(list, true);
      toast(`Данные заменены: ${list.length} опер.`);
    } else {
      const ids = new Set(state.txs.map(t => t.id));
      const add = list.filter(t => !ids.has(t.id));
      state.txs = state.txs.concat(add);
      await Store.putMany(add, false);
      toast(`Добавлено ${add.length} опер., пропущено дубликатов: ${list.length - add.length}`);
    }
  } catch (err) { toast('Ошибка при сохранении импорта'); }
  resetForm(false);
  render();
});
$('#exportJson').addEventListener('click', exportJson);
$('#exportCsv').addEventListener('click', exportCsv);

/* ---------- Запуск ---------- */
(async function init() {
  fillCategoryOptions();
  F.date.value = todayISO();
  await Store.init();
  const d = await Store.load();
  state.txs = d.list.filter(t => t && t.id && t.date && t.amount > 0);
  state.lastExport = d.lastExport;
  render();
})();
})();
</script>
